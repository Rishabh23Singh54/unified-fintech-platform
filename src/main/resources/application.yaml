spring:
  application:
    name: platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unified_fintech_platform}
    username: ${DB_USERNAME:postgres_user}
    password: ${DB_PASSWORD:postgres_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true #dev
    # show-sql: false #prod 

  flyway:
    enabled: true
    locations: classpath:db/migration
